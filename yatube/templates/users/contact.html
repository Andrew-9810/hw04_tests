{% extends 'base.html' %}
{% block title %}Контакты{% endblock %}

  <div class="row justify-content-center">
    <div class="col-md-8 p-5">
      <div class="card">
        <div class="card-header">
          Контакты
        </div>
        <div class="card-body">
          <p>
            <form method="post">
              {% csrf_token %}
              {{ form.as_p }}

                <button tupe="submit" class="btn btn-primary">
                  Сохранить

              </div>
            </form>
          </p>
        </div> <!-- card body -->
      </div> <!-- card -->
    </div> <!-- col -->
  </div> <!-- row -->
{% endblock %}
